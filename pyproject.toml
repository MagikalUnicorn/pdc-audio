[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdc-audio"
version = "3.3.0"
description = "Decode MOVA SEMC PDC-AUDIO objects from compatible ASF recordings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
pdc-audio = "pdc_audio.decode_mova_asf:main"
pdc-audio-decode-records = "pdc_audio.semc_pdc_records:main"
pdc-audio-extract = "pdc_audio.extract_semc_pdc_audio:main"
pdc-audio-preserve = "pdc_audio.preserve_semc_pdc_attachment:main"

[tool.setuptools.packages.find]
where = ["src"]
