[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdc-audio"
version = "3.3.0"
description = "Decode Sony MOVA SEMC PDC-AUDIO objects from ASF recordings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
pdc-audio = "pdc_audio.decode_sony_asf:main"
pdc-audio-decode-records = "pdc_audio.sony_unpack:main"
pdc-audio-extract = "pdc_audio.extract_semc_pdc_audio:main"
pdc-audio-preserve = "pdc_audio.preserve_semc_pdc_attachment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdc_audio = ["arib_std27_tables.npz"]
